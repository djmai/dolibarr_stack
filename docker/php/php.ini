memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
display_errors = On
log_errors = On
error_log = /var/log/php_errors.log
session.use_strict_mode = 1
# open_basedir = /app:/tmp:/app/public:/app/custom/:/app/documents
short_open_tag = 0
allow_url_fopen = 0
disable_functions = dl, apache_note, apache_setenv, pcntl_alarm, pcntl_fork, pcntl_waitpid, pcntl_wait, pcntl_wifexited, pcntl_wifstopped, pcntl_wifsignaled, pcntl_wifcontinued, pcntl_wexitstatus, pcntl_wtermsig, pcntl_wstopsig, pcntl_signal, pcntl_signal_get_handler, pcntl_signal_dispatch, pcntl_get_last_error, pcntl_strerror, pcntl_sigprocmask, pcntl_sigwaitinfo, pcntl_sigtimedwait, pcntl_exec, pcntl_getpriority, pcntl_setpriority, pcntl_async_signals, show_source, virtual
