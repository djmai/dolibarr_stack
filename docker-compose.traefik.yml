# ==============================================================================
#
#   DOCKER COMPOSE - Traefik (HTTP local, sin HTTPS)
#
#   Propósito: Añadir un proxy inverso Traefik para usar dominios locales
#              (ej: dolibarr.local) sin necesidad de HTTPS.
#
#   Uso:  docker compose -f docker-compose.traefik.yml up -d
#
# ==============================================================================
services:
  traefik:
    image: "traefik:latest" # O incluso solo traefik:latest
    container_name: "traefik"
    restart: unless-stopped
    ports:
      - "80:80" # Tráfico HTTP de los dominios
      # - "8080:8080" # Dashboard de Traefik
    volumes:
      # Configuración de Traefik
      - "./traefik/configs/traefik.yml:/etc/traefik/traefik.yml:ro"
      # Configuración dinámica: certificados TLS, middlewares, etc.
      - "./traefik/dynamic:/etc/traefik/dynamic:ro"
      # Montar el socket de Docker para que Traefik pueda descubrir contenedores
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - red-local
    labels:
      # Deshabilitar Traefik para sí mismo (no queremos que se auto-enrute)
      - "traefik.enable=false"

  app:
    build: ./Docker
    container_name: ${APP_NAME:-dolibarr}
    restart: unless-stopped
    networks:
      - red-local
    volumes:
      - ./${APP_FOLDER:-app}:${APP_PATH:-/app}:delegated # Carpeta de la aplicación
      - ./Docker/php/php.ini:/usr/local/etc/php/php.ini # Monta el archivo php.ini
    environment:
      APP_ENV: ${APP_ENV:-local}
      TZ: ${TZ:-America/Mexico_City}
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=red-local"

      # --- Router HTTP ---
      - "traefik.http.routers.${APP_NAME:-dolibarr}-http.rule=Host(`${APP_DOMAIN_DEV:-dolibarr.local}`)"
      - "traefik.http.routers.${APP_NAME:-dolibarr}-http.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-dolibarr}-http.service=${APP_NAME:-dolibarr}"
      - "traefik.http.routers.${APP_NAME:-dolibarr}-http.middlewares=security-headers@file"

      # --- Servicio ---
      - "traefik.http.services.${APP_NAME:-dolibarr}.loadbalancer.server.port=80"

  mariadb:
    image: mariadb:latest
    container_name: ${DB_NAME:-mariadb}
    restart: unless-stopped
    networks:
      - red-local
    # ports:
    # - "${MARIA_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIA_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MARIA_DATABASE:-dolibarr}
      MYSQL_USER: ${MARIA_USER:-dolibarr}
      MYSQL_PASSWORD: ${MARIA_PASSWORD:-dolibarr}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - ./db/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

#
# Networks definitions
#
networks:
  red-local:
    # external: true
    driver: bridge
    name: ${NETWORK_NAME:-red-local}
